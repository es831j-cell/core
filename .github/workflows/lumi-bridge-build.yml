name: Lumi Trusted Relay Build
run-name: Lumi trusted relay ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Owner-approved Guardian request id
        required: true
        type: string
      target_version:
        description: Expected forward version code
        required: true
        type: string
      target_name:
        description: Expected version name
        required: true
        type: string
      target_source_sha256:
        description: Exact verified canonical-source archive SHA-256
        required: true
        type: string

permissions:
  contents: read

jobs:
  signed-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify relay transaction marker
        shell: bash
        run: |
          set -euo pipefail
          test -s .lumi/relay.json
          python - <<'PY'
          import json, re
          d=json.load(open('.lumi/relay.json','r',encoding='utf-8'))
          req='${{ inputs.request_id }}'
          target='${{ inputs.target_version }}'
          assert d.get('requestId') == req, 'relay request mismatch'
          assert str(d.get('targetVersion')) == target, 'relay target mismatch'
          assert d.get('targetSourceSha256') == '${{ inputs.target_source_sha256 }}', 'relay target source mismatch'
          assert re.fullmatch(r'[0-9a-f]{64}', d.get('targetSourceSha256','')), 'malformed target source hash'
          assert re.fullmatch(r'tx-[0-9]+-[A-Za-z0-9-]+', req), 'malformed request id'
          print('relay marker verified')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
      - name: Restore private Lumi signing identity from Factory baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main --depth=1
          git show origin/main:apkfactory-project.zip > /tmp/apkfactory-project.zip
          unzip -p /tmp/apkfactory-project.zip app/keystore.properties > app/keystore.properties
          unzip -p /tmp/apkfactory-project.zip app/lumi-prototype-debug.jks > app/lumi-prototype-debug.jks
          test -s app/keystore.properties
          test -s app/lumi-prototype-debug.jks
          chmod 600 app/keystore.properties app/lumi-prototype-debug.jks
      - name: Verify requested version matches source
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq "versionCode[[:space:]]+${{ inputs.target_version }}([[:space:]]|$)" app/build.gradle
          grep -Fq "versionName '${{ inputs.target_name }}'" app/build.gradle
      - name: Build signed release
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Select exactly one APK and prove canonical source identity
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print)
          test "${#apks[@]}" -eq 1
          cp "${apks[0]}" Lumi-Relay-Signed.apk
          test -s Lumi-Relay-Signed.apk
          unzip -p Lumi-Relay-Signed.apk assets/lumi-source/canonical-source-metadata.json > /tmp/lumi-source-meta.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/lumi-source-meta.json','r',encoding='utf-8'))
          assert str(d.get('versionCode')) == '${{ inputs.target_version }}', 'APK canonical version mismatch'
          assert d.get('sourceArchiveSha256') == '${{ inputs.target_source_sha256 }}', 'APK canonical source hash mismatch'
          print('relay APK canonical source identity verified')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lumi-relay-${{ inputs.request_id }}
          path: Lumi-Relay-Signed.apk
          if-no-files-found: error
          retention-days: 7
