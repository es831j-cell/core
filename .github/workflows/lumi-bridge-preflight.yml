name: Lumi Bridge Preflight
run-name: Lumi bridge preflight ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Bridge preflight request id
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Load-test retained private Lumi signing baseline
        shell: bash
        run: |
          set -euo pipefail
          REQ='${{ inputs.request_id }}'
          [[ "$REQ" =~ ^pf-[0-9]+-[A-Za-z0-9]+$ ]]
          test -s apkfactory-project.zip
          unzip -p apkfactory-project.zip app/keystore.properties > /tmp/keystore.properties
          unzip -p apkfactory-project.zip app/lumi-prototype-debug.jks > /tmp/lumi-preflight.jks
          test -s /tmp/keystore.properties
          test -s /tmp/lumi-preflight.jks
          STORE_PASSWORD="$(sed -n 's/^storePassword=//p' /tmp/keystore.properties | head -1)"
          KEY_ALIAS="$(sed -n 's/^keyAlias=//p' /tmp/keystore.properties | head -1)"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          keytool -list -keystore /tmp/lumi-preflight.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          rm -f /tmp/lumi-preflight.jks /tmp/keystore.properties
          echo "Lumi bridge retained signing baseline PASS for $REQ"
