name: Lumi Bridge Preflight
run-name: Lumi bridge preflight ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Bridge preflight request id
        required: true
        type: string

permissions:
  contents: read

env:
  EXPECTED_CERT_SHA256: 0ad00784e2d593a469cb445d2cc1afe94e31663768f96470a38144e84efe8ad2

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify protected Lumi signing identity
        shell: bash
        env:
          INPUT_REQUEST_ID: ${{ inputs.request_id }}
          LUMI_KEYSTORE_B64: ${{ secrets.LUMI_KEYSTORE_B64 }}
          LUMI_STORE_PASSWORD: ${{ secrets.LUMI_STORE_PASSWORD }}
          LUMI_KEY_ALIAS: ${{ secrets.LUMI_KEY_ALIAS }}
          LUMI_KEY_PASSWORD: ${{ secrets.LUMI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$INPUT_REQUEST_ID" =~ ^pf-[0-9]+-[A-Za-z0-9]+$ ]] || { echo "Malformed preflight request id"; exit 2; }
          test -n "${LUMI_KEYSTORE_B64:-}" || { echo "Missing LUMI_KEYSTORE_B64"; exit 3; }
          test -n "${LUMI_STORE_PASSWORD:-}" || { echo "Missing LUMI_STORE_PASSWORD"; exit 3; }
          test -n "${LUMI_KEY_ALIAS:-}" || { echo "Missing LUMI_KEY_ALIAS"; exit 3; }
          test -n "${LUMI_KEY_PASSWORD:-}" || { echo "Missing LUMI_KEY_PASSWORD"; exit 3; }

          keystore="$RUNNER_TEMP/lumi-preflight-$GITHUB_RUN_ID.jks"
          proof_store="$RUNNER_TEMP/lumi-preflight-$GITHUB_RUN_ID.p12"
          printf '%s' "$LUMI_KEYSTORE_B64" | base64 --decode > "$keystore"
          test -s "$keystore"
          keytool -list -keystore "$keystore" -storepass "$LUMI_STORE_PASSWORD" \
            -alias "$LUMI_KEY_ALIAS" >/dev/null

          proof_password="Lumi-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-Proof"
          keytool -importkeystore -noprompt \
            -srckeystore "$keystore" -srcstorepass "$LUMI_STORE_PASSWORD" \
            -srcalias "$LUMI_KEY_ALIAS" -srckeypass "$LUMI_KEY_PASSWORD" \
            -destkeystore "$proof_store" -deststoretype PKCS12 \
            -deststorepass "$proof_password" -destkeypass "$proof_password" >/dev/null
          test -s "$proof_store"

          cert_sha="$(keytool -list -v -keystore "$keystore" -storepass "$LUMI_STORE_PASSWORD" \
            -alias "$LUMI_KEY_ALIAS" | sed -n 's/.*SHA256: //p' | head -1 \
            | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          test "$cert_sha" = "$EXPECTED_CERT_SHA256" || { echo "Lumi signing certificate mismatch"; exit 4; }
          echo "Lumi signing preflight PASS for $INPUT_REQUEST_ID"

      - name: Remove ephemeral preflight material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP"/lumi-preflight-"$GITHUB_RUN_ID".jks "$RUNNER_TEMP"/lumi-preflight-"$GITHUB_RUN_ID".p12
