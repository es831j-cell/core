name: Lumi Code371 Bridge Build R87 Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore private Lumi signing identity
        shell: bash
        env:
          LUMI_KEYSTORE_B64: ${{ secrets.LUMI_KEYSTORE_B64 }}
          LUMI_STORE_PASSWORD: ${{ secrets.LUMI_STORE_PASSWORD }}
          LUMI_KEY_ALIAS: ${{ secrets.LUMI_KEY_ALIAS }}
          LUMI_KEY_PASSWORD: ${{ secrets.LUMI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${LUMI_KEYSTORE_B64:-}" || { echo "Missing LUMI_KEYSTORE_B64"; exit 2; }
          test -n "${LUMI_STORE_PASSWORD:-}" || { echo "Missing LUMI_STORE_PASSWORD"; exit 2; }
          test -n "${LUMI_KEY_ALIAS:-}" || { echo "Missing LUMI_KEY_ALIAS"; exit 2; }
          test -n "${LUMI_KEY_PASSWORD:-}" || { echo "Missing LUMI_KEY_PASSWORD"; exit 2; }
          printf '%s' "$LUMI_KEYSTORE_B64" | base64 --decode > app/lumi-prototype-debug.jks
          chmod 600 app/lumi-prototype-debug.jks
          cat > app/keystore.properties <<PROPS
          storeFile=lumi-prototype-debug.jks
          storePassword=${LUMI_STORE_PASSWORD}
          keyAlias=${LUMI_KEY_ALIAS}
          keyPassword=${LUMI_KEY_PASSWORD}
          PROPS
          chmod 600 app/keystore.properties
      - name: Build signed Lumi release and Code371 INAPP package
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Verify Code371 INAPP output exists
        run: test -s app/build/outputs/lumi-inapp/Code371-Bridge-Build-R87-INAPP.zip
      - uses: actions/upload-artifact@v4
        with:
          name: lumi-code371-bridge-build-r87
          path: |
            app/build/outputs/lumi-inapp/Code371-Bridge-Build-R87-INAPP.zip
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
